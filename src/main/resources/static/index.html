<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Train Movement Tracker</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- SockJS + STOMP for WebSocket -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
    <!-- ── Sidebar ───────────────────────────────────────────────── -->
    <aside id="sidebar">
        <div id="sidebar-header">
            <h1>🚆 Train Tracker</h1>
        </div>

        <!-- Search -->
        <div id="search-section">
            <input type="text" id="train-search" placeholder="Search train # or name…" autocomplete="off" />
            <button id="search-btn">Search</button>
        </div>
        <div style="padding: 8px 14px 4px 14px; font-size: 0.76rem; color: #888888; text-transform: uppercase; letter-spacing: 0.5px;">
            Database Trains (Select to Plot & Track)
        </div>
        <ul id="search-results"></ul>

        <!-- Info Panel -->
        <div id="info-panel" class="hidden">
            <h2 id="info-train-name"></h2>
            <div class="info-row"><span class="label">Number</span><span id="info-number"></span></div>
            <div class="info-row"><span class="label">From</span><span id="info-from"></span></div>
            <div class="info-row"><span class="label">To</span><span id="info-to"></span></div>
            <div class="info-row"><span class="label">Status</span><span id="info-status" class="badge"></span></div>
            <div class="info-row"><span class="label">Current Location</span><span id="info-location" style="font-weight:600;color:#6fffa0;"></span></div>
            <div class="info-row"><span class="label">Next Halt</span><span id="info-next-halt"></span></div>
            <div class="info-row"><span class="label">Speed</span><span id="info-speed"></span></div>
            <div class="info-row"><span class="label">Delay</span><span id="info-delay"></span></div>
            <div class="info-row"><span class="label">Last Update</span><span id="info-updated"></span></div>
            <div class="info-row"><span class="label">Source</span><span id="info-source"></span></div>

            <div id="data-indicator" class="indicator live">● LIVE</div>

            <div id="action-btns">
                <button id="follow-btn" class="btn-secondary">Follow Train</button>
                <button id="stop-btn" class="btn-danger hidden">Stop Tracking</button>
            </div>
        </div>
    </aside>

    <!-- ── Map ──────────────────────────────────────────────────── -->
    <main id="map-container">
        <div id="map"></div>
        <div id="connection-status" class="status-badge">⚪ Connecting…</div>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>

# ── Server ──────────────────────────────────────────────
server.port=${PORT:8080}
server.address=0.0.0.0

# ── H2 In-Memory Database ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:train_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=false
spring.jackson.serialization.fail-on-empty-beans=false

# ── External API (RailCore API) ──────────────────────
app.provider.base-url=https://ir.railcore.tech
app.provider.api-key=rk_live_YQd0da8DhkeVlxFk2dk_-MwsBmvYmMfn
app.provider.poll-interval-ms=15000

# ── Tracking ─────────────────────────────────────────────
app.tracking.stale-threshold-ms=120000
app.tracking.snap-tolerance-metres=500
app.tracking.history-snapshot-every=5

# ── Mode ─────────────────────────────────────────────────
app.simulation.enabled=false
